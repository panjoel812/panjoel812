<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Joel Pan — student, builder, and creator</title>
  <desc id="desc">A quiet spatial banner with Joel Pan's name, interests, and a glowing intelligence core.</desc>

  <defs>
    <linearGradient id="background" x1="70" y1="28" x2="1130" y2="418" gradientUnits="userSpaceOnUse">
      <stop class="background-start" stop-color="#050609"/>
      <stop class="background-end" offset="1" stop-color="#0B0D14"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(921 223) rotate(90) scale(242)">
      <stop stop-color="#7C3AED" stop-opacity=".34"/>
      <stop offset=".5" stop-color="#4F46E5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#312E81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(986 190) rotate(119) scale(152)">
      <stop stop-color="#22D3EE" stop-opacity=".24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(900 186) rotate(54) scale(132)">
      <stop stop-color="#F8FAFF"/>
      <stop offset=".17" stop-color="#B6F4FF"/>
      <stop offset=".42" stop-color="#67E8F9"/>
      <stop offset=".69" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#312E81"/>
    </radialGradient>
    <linearGradient id="coreSheen" x1="860" y1="147" x2="994" y2="282" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset=".35" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spectralLine" x1="784" y1="220" x2="1076" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".25" stop-color="#22D3EE" stop-opacity=".68"/>
      <stop offset=".72" stop-color="#A78BFA" stop-opacity=".84"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="stars" width="116" height="92" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="17" r="1" fill="#FFFFFF" opacity=".24"/>
      <circle cx="61" cy="10" r=".7" fill="#A5F3FC" opacity=".26"/>
      <circle cx="103" cy="39" r="1.2" fill="#C4B5FD" opacity=".2"/>
      <circle cx="31" cy="72" r=".75" fill="#FFFFFF" opacity=".18"/>
      <circle cx="82" cy="63" r=".55" fill="#FFFFFF" opacity=".28"/>
    </pattern>
    <filter id="blur36" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="blur12" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="coreShadow" x="-90%" y="-90%" width="280%" height="280%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#02030A" flood-opacity=".64"/>
      <feDropShadow dx="0" dy="0" stdDeviation="13" flood-color="#8B5CF6" flood-opacity=".42"/>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="438" rx="34"/>
    </clipPath>
    <clipPath id="sphere">
      <circle cx="930" cy="220" r="82"/>
    </clipPath>
  </defs>

  <style>
    .background-start { stop-color: #050609; }
    .background-end { stop-color: #0B0D14; }
    .frame-stroke { stroke: rgba(255, 255, 255, .11); }
    .text-primary { fill: #F7F8FC; }
    .text-secondary { fill: #A6ABBA; }
    .text-muted { fill: #747B8E; }
    .hairline { stroke: rgba(255, 255, 255, .12); }
    .gridline { stroke: rgba(255, 255, 255, .055); }
    .chip { fill: rgba(255, 255, 255, .055); stroke: rgba(255, 255, 255, .10); }
    .chip-text { fill: #C5CAD7; }
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .display { font-size: 70px; font-weight: 650; letter-spacing: -3.4px; }
    .eyebrow { font-size: 12px; font-weight: 650; letter-spacing: 3.2px; }
    .role { font-size: 17px; font-weight: 520; letter-spacing: .15px; }
    .statement { font-size: 21px; font-weight: 520; letter-spacing: -.25px; }
    .micro { font-size: 10px; font-weight: 650; letter-spacing: 2.2px; }
    .orbit-a { animation: orbit 22s linear infinite; transform-box: fill-box; transform-origin: center; }
    .orbit-b { animation: orbit-reverse 30s linear infinite; transform-box: fill-box; transform-origin: center; }
    .drift-a { animation: drift-a 13s ease-in-out infinite alternate; }
    .drift-b { animation: drift-b 17s ease-in-out infinite alternate; }
    .breathe { animation: breathe 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .signal { animation: signal 4.8s ease-in-out infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes orbit-reverse { to { transform: rotate(-360deg); } }
    @keyframes drift-a { from { transform: translate(-7px, -3px); } to { transform: translate(9px, 5px); } }
    @keyframes drift-b { from { transform: translate(5px, 7px); } to { transform: translate(-8px, -4px); } }
    @keyframes breathe { 0%, 100% { transform: scale(.98); opacity: .82; } 50% { transform: scale(1.035); opacity: 1; } }
    @keyframes signal { 0%, 100% { opacity: .35; } 50% { opacity: .92; } }
    @media (prefers-color-scheme: light) {
      .background-start { stop-color: #F7F8FC; }
      .background-end { stop-color: #EDF0F7; }
      .frame-stroke { stroke: rgba(20, 25, 38, .12); }
      .text-primary { fill: #151721; }
      .text-secondary { fill: #565E70; }
      .text-muted { fill: #7A8293; }
      .hairline { stroke: rgba(20, 25, 38, .14); }
      .gridline { stroke: rgba(20, 25, 38, .06); }
      .chip { fill: rgba(255, 255, 255, .5); stroke: rgba(20, 25, 38, .10); }
      .chip-text { fill: #444B5C; }
    }
    @media (prefers-reduced-motion: reduce) {
      .motion { animation: none !important; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="url(#background)"/>
    <ellipse cx="913" cy="222" rx="318" ry="286" fill="url(#violetGlow)"/>
    <ellipse cx="1015" cy="157" rx="204" ry="170" fill="url(#cyanGlow)"/>

    <g class="drift-a motion" opacity=".72">
      <rect x="0" y="0" width="1200" height="440" fill="url(#stars)"/>
    </g>
    <g class="gridline" fill="none" stroke-width="1">
      <path d="M670 0V440M760 0V440M850 0V440M940 0V440M1030 0V440M1120 0V440"/>
      <path d="M610 80H1200M610 170H1200M610 260H1200M610 350H1200"/>
    </g>
    <rect x="610" y="0" width="220" height="440" fill="url(#background)" opacity=".58"/>

    <g class="font">
      <g transform="translate(80 76)">
        <circle cx="5" cy="-4" r="4" fill="#67E8F9"/>
        <circle class="signal motion" cx="5" cy="-4" r="8" fill="none" stroke="#67E8F9" stroke-opacity=".5"/>
        <text class="eyebrow text-secondary" x="24" y="0">STUDENT · BUILDER · CREATOR</text>
      </g>

      <text class="display text-primary" x="76" y="170"><tspan>Joel</tspan><tspan dx="15">Pan</tspan></text>
      <text class="role text-secondary" x="81" y="211">Mathematics · Artificial intelligence · Software</text>
      <line class="hairline" x1="81" y1="247" x2="524" y2="247"/>
      <text class="statement text-primary" x="81" y="286">Learn deeply. Build carefully.</text>
      <text class="statement text-primary" x="81" y="316">Explain clearly.</text>

      <g transform="translate(81 352)">
        <rect class="chip" width="102" height="34" rx="17"/>
        <text class="micro chip-text" x="51" y="22" text-anchor="middle">THEORY</text>
      </g>
      <g transform="translate(195 352)">
        <rect class="chip" width="116" height="34" rx="17"/>
        <text class="micro chip-text" x="58" y="22" text-anchor="middle">ENGINEERING</text>
      </g>
      <g transform="translate(323 352)">
        <rect class="chip" width="104" height="34" rx="17"/>
        <text class="micro chip-text" x="52" y="22" text-anchor="middle">DESIGN</text>
      </g>
    </g>

    <g opacity=".42" fill="none" stroke="url(#spectralLine)" stroke-width="1">
      <path d="M705 132C790 158 809 215 850 220C808 231 773 280 703 310"/>
      <path d="M1161 120C1085 147 1060 200 1011 218C1060 238 1091 288 1165 315"/>
      <path d="M737 221H1126" stroke-dasharray="3 9"/>
    </g>

    <g class="drift-b motion">
      <circle cx="783" cy="136" r="3" fill="#67E8F9" opacity=".72"/>
      <circle cx="1085" cy="127" r="2.5" fill="#C4B5FD" opacity=".7"/>
      <circle cx="1110" cy="291" r="3.5" fill="#A78BFA" opacity=".56"/>
      <circle cx="774" cy="306" r="2.5" fill="#67E8F9" opacity=".5"/>
    </g>

    <g class="orbit-b motion" fill="none">
      <ellipse cx="930" cy="220" rx="166" ry="68" stroke="#67E8F9" stroke-opacity=".27" stroke-width="1"/>
      <circle cx="764" cy="220" r="4" fill="#67E8F9" stroke="none"/>
    </g>
    <g class="orbit-a motion" fill="none">
      <ellipse cx="930" cy="220" rx="125" ry="125" stroke="#A78BFA" stroke-opacity=".22" stroke-width="1" stroke-dasharray="2 8"/>
      <circle cx="1018" cy="132" r="4" fill="#C4B5FD" stroke="none"/>
    </g>
    <g transform="rotate(-27 930 220)" fill="none">
      <ellipse cx="930" cy="220" rx="190" ry="92" stroke="#FFFFFF" stroke-opacity=".11"/>
      <ellipse cx="930" cy="220" rx="103" ry="156" stroke="#A5F3FC" stroke-opacity=".15"/>
    </g>

    <circle cx="930" cy="220" r="112" fill="#8B5CF6" opacity=".18" filter="url(#blur36)"/>
    <g class="breathe motion" filter="url(#coreShadow)">
      <circle cx="930" cy="220" r="82" fill="url(#core)"/>
      <g clip-path="url(#sphere)" fill="none" stroke="#FFFFFF">
        <path d="M836 184C879 211 903 205 936 167C964 135 995 151 1021 173" stroke-opacity=".28"/>
        <path d="M837 237C879 211 917 224 946 261C971 294 1003 269 1023 247" stroke-opacity=".25"/>
        <ellipse cx="930" cy="220" rx="57" ry="82" stroke-opacity=".2"/>
        <ellipse cx="930" cy="220" rx="82" ry="35" stroke-opacity=".18"/>
      </g>
      <circle cx="930" cy="220" r="82" fill="url(#coreSheen)" opacity=".48"/>
      <circle cx="930" cy="220" r="80" fill="none" stroke="#FFFFFF" stroke-opacity=".32"/>
    </g>

    <g fill="#FFFFFF">
      <circle cx="885" cy="186" r="3.2" opacity=".83"/>
      <circle cx="964" cy="185" r="2.6" opacity=".72"/>
      <circle cx="981" cy="235" r="3" opacity=".74"/>
      <circle cx="914" cy="262" r="2.5" opacity=".66"/>
      <circle cx="874" cy="231" r="2.2" opacity=".68"/>
      <path d="M885 186L964 185L981 235L914 262L874 231Z" fill="none" stroke="#FFFFFF" stroke-opacity=".34"/>
      <path d="M885 186L914 262M964 185L874 231" fill="none" stroke="#FFFFFF" stroke-opacity=".2"/>
    </g>

    <g class="font">
      <text class="micro text-muted" x="930" y="405" text-anchor="middle">THEORY · ENGINEERING · CREATIVE TECHNOLOGY</text>
    </g>
  </g>
  <rect class="frame-stroke" x="1" y="1" width="1198" height="438" rx="34" fill="none"/>
</svg>
